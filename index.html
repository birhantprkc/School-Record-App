<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All-in-One 학교생활기록부 에디터</title>
    <style>
      body {
        background-color: #080b14;
        color: #e2e8f0;
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
      }

      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #080b14;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #app-loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      /* 앱 아이콘을 그대로 쓴다. 아이콘이 자기 배경과 라운드(22%)를 가지고 있으므로
         여기서는 홈 화면(.logo-icon)과 같은 그림자만 얹는다. */
      .loading-logo {
        width: 68px;
        height: 68px;
        border-radius: 15px;
        box-shadow: 0 0 0 1px rgba(251, 191, 36, 0.2), 0 8px 32px rgba(76, 110, 245, 0.35);
      }

      .loading-spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #1a2035;
        border-top-color: #fbbf24;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loading-text {
        font-size: 18px;
        color: #6b8ab5;
        letter-spacing: 0.05em;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Vue 마운트 전 표시되는 로딩 화면 -->
    <div id="app-loading">
      <img class="loading-logo" src="/app-icon.svg" alt="">
      <div class="loading-spinner"></div>
      <span class="loading-text">Loading...</span>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
