# Dependabot 설정.
#
# 이 파일은 **버전 업데이트 PR**만 담당한다. 보안 경고(Dependabot alerts)는 저장소 설정이라
# 여기서 못 켠다 - Settings > Code security 에서 한 번 켜야 한다.
#
# **묶되, 검증 방법이 다른 것끼리는 쪼갠다.** 관리자가 한 명인 저장소라 PR이 쏟아지면
# 아무것도 안 보게 되므로 묶는 것이 기본이다. 다만 생태계마다 하나로 몰아넣었더니
# PR #29(cargo 6개)와 #28(npm 4개)에서 서로 무관한 이유로 한꺼번에 깨져 몇 주씩 아무것도
# 못 올리는 일이 반복됐다. 그래서 **한 PR 안의 것들이 같은 방법으로 검증되는지**를
# 기준으로 나눈다. 같이 올릴 수밖에 없는 것(peer/세대 공유)은 그대로 묶어 둔다.
#
# 실제로 조심해야 하는 것은 **교사가 업로드하는 학생 데이터 엑셀 파일을 파싱하는
# 의존성**이다 - exceljs, xlsx(SheetJS). 남이 만든 파일을 여는 코드라 여기 취약점은
# 우리 신뢰 경계 안에 있다.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 그룹이 5개이므로 한도도 함께 올린다. 낮으면 일부 그룹이 아예 안 올라온다.
    open-pull-requests-limit: 5
    groups:
      # 사용자 업로드 엑셀 파일을 파싱하는 것들. 따로 보고 싶은 묶음이라 먼저 잡는다.
      parsers:
        patterns:
          - exceljs
          - xlsx
      # 런타임 프레임워크. 앱 동작에 직접 영향이 가므로 실제로 실행해봐야 안다.
      # 특히 pinia는 CLAUDE.md가 "Store = single source of truth"로 못박은
      # 아키텍처의 중심이라, 메이저 업그레이드는 단독으로 보고 싶다.
      vue:
        patterns:
          - vue
          - pinia
          - vue-router
      # 빌드·테스트 도구. 깨지면 빌드가 안 되지 앱 동작이 틀리지는 않는다.
      #
      # 묶는 이유는 cargo의 crypto와 같다: vite와 @vitejs/plugin-vue, tailwind 플러그인,
      # vitest는 서로 peer로 엮여 있어 따로 올리면 설치 단계에서 막힌다.
      # 확인은 `npm run build`와 실제 앱 구동으로 한다(단위 테스트로는 안 잡힌다).
      build:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - tailwindcss
          - '@tailwindcss/*'
      # Rust 쪽 tauri 그룹과 짝. 둘의 버전이 어긋나면 IPC에서 문제가 난다.
      tauri-js:
        patterns:
          - '@tauri-apps/*'
      # 나머지(diff, lucide-vue-next, pretendard 등).
      # '*'는 먼저 매칭되는 그룹이 이기므로 반드시 마지막에 둔다.
      frontend:
        patterns:
          - '*'

  # cargo는 **검증 방법이 다른 것끼리 쪼갠다.**
  #
  # 원래 crate 전체를 backend 하나로 묶었는데, PR #29에서 crate 6개가 서로 무관한
  # 이유로 한꺼번에 깨져 3주간 아무것도 못 올렸다. 실제로 쪼개보니 독립 그룹은
  # 4개였고, 그룹마다 확인해야 하는 것이 완전히 달랐다. 아래 경계는 그 결과다.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    # 그룹이 4개이므로 한도도 함께 올린다. 낮으면 일부 그룹이 아예 안 올라온다.
    open-pull-requests-limit: 4
    groups:
      # 암호화. 학생 개인정보를 지키는 코드라 crypto_vector_tests.rs(고정 벡터)로
      # 저장 형식·키 파생이 안 바뀌었는지 확인해야 한다.
      #
      # 굳이 묶는 이유: RustCrypto crate들은 digest/aead 세대를 공유해서 따로 못 올린다.
      # 실제로 pbkdf2 0.13은 digest 0.11을 요구하므로 sha2 0.11과 반드시 같이 가야 하고,
      # 하나만 올리면 digest 0.10/0.11이 공존해 컴파일 자체가 안 된다.
      # 따로 떼면 "혼자서는 빌드도 안 되는 PR"이 생기므로 묶는 편이 낫다.
      crypto:
        patterns:
          - aes-gcm
          - pbkdf2
          - sha2
          - rand
          - base64
          - zeroize
      # DB. rusqlite는 **번들 SQLite 엔진 버전이 같이 올라간다**(0.31→0.40에서
      # 3.45→3.53). 사용자 PC의 기존 DB 파일을 다루므로 확인 방법이 위와 전혀 다르다.
      # real_file_tests.rs의 verify_real_user_files로 실제 파일을 열어봐야 한다.
      database:
        patterns:
          - rusqlite
          - libsqlite3-sys
      # 프레임워크. 깨지면 앱이 아예 안 뜨므로 위험 등급이 따로다.
      tauri:
        patterns:
          - tauri
          - tauri-*
      # 나머지(serde, chrono, regex 등). 대개 그냥 통과한다.
      backend:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
