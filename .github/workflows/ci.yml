name: "CI"

on:
  pull_request:
  push:
    # '**'는 슬래시가 포함된 이름(dependabot/...)까지 포함한 모든 브랜치를 뜻한다.
    # 태그 push에는 반응하지 않는다.
    branches:
      - '**'

# 같은 브랜치에 연속으로 push하면 진행 중이던 이전 실행을 취소한다.
# PR 이벤트에서 github.ref는 refs/pull/N/merge가 되므로,
# 같은 PR의 연속 push를 묶으려면 head_ref(원본 브랜치명)를 먼저 본다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        # npm install과 달리 락파일을 고치지 않고 그대로 설치한다.
        # 같은 커밋이면 항상 같은 의존성으로 테스트된다.
        run: npm ci

      - name: unit test
        run: npm run test
